<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="nile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#070D1B" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF3B0" />
      <stop offset="35%" stopColor="#F5D061" />
      <stop offset="70%" stopColor="#E5B842" />
      <stop offset="100%" stopColor="#B38600" />
    </linearGradient>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5D061" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#996F00" stopOpacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#nile-bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#gold-border)" stroke-width="4" fill="none" opacity="0.6" />

  <!-- Center Graphic: Golden Horus Crown, Letter N, and Pyramid -->
  <g transform="translate(106, 76)">
    <!-- Horus Crown / Headdress -->
    <path d="M150 12 C115 12 90 32 80 62 C105 52 145 52 150 52 C155 52 195 52 220 62 C210 32 185 12 150 12 Z" fill="url(#gold-grad)" />
    <!-- Eye of Horus Motif -->
    <path d="M150 28 C132 28 116 38 108 50 C116 62 132 72 150 72 C168 72 184 62 192 50 C184 38 168 28 150 28 Z" fill="#070D1B" stroke="url(#gold-grad)" stroke-width="5" />
    <circle cx="150" cy="50" r="10" fill="url(#gold-grad)" filter="url(#glow)" />
    <path d="M136 72 Q150 96 170 98" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Stylized Monogram N -->
    <!-- Left vertical bar of N -->
    <path d="M72 110 L108 110 C104 150 102 210 102 250 L66 250 C70 200 70 140 72 110 Z" fill="url(#gold-grad)" />
    <!-- Diagonal stroke of N -->
    <path d="M96 110 L204 250 L234 250 L126 110 Z" fill="url(#gold-grad)" filter="url(#glow)" />
    <!-- Right vertical bar of N -->
    <path d="M198 110 L234 110 C232 140 232 200 236 250 L200 250 C200 210 198 150 198 110 Z" fill="url(#gold-grad)" />

    <!-- Golden Sacred Pyramid Base below N -->
    <polygon points="150,266 70,346 230,346" fill="url(#gold-grad)" opacity="0.95" />
    <line x1="150" y1="266" x2="150" y2="346" stroke="#070D1B" stroke-width="4" />
    <line x1="150" y1="266" x2="105" y2="346" stroke="#070D1B" stroke-width="2" opacity="0.6" />
    <line x1="150" y1="266" x2="195" y2="346" stroke="#070D1B" stroke-width="2" opacity="0.6" />
    <line x1="105" y1="310" x2="195" y2="310" stroke="#070D1B" stroke-width="2" opacity="0.6" />
  </g>
</svg>
